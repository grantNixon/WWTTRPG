<!DOCTYPE html>
<html lang="en">
    <head>
        <Meta charset="utf-8">
        <title>Outer West</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                font-family: 'Libre Baskerville', sans-serif;
            }
    
            h1 {
                font-family: 'Libre Baskerville', sans-serif;
            }

            p {
                font-family: 'Libre Baskerville', sans-serif;
            }
        </style>
    </head>
    <nav class="navbar navbar-expand" style="background-color: Black;">
      <header class="container-fluid">
        <div class="text-bg-dark">
         <ul class="nav col-12 col-lg-auto me-lg-auto justify-content-center mb-md-0 me-2" style="background-color: black;">
                  <li><a href="{% url 'home_page'%}" class="nav-link link-offset-2 link-offset-3-hover link-secondary link-underline-opacity-0 link-underline-opacity-75-hover text-light ms-5 me-5">Outer West</a></li>
                  <span class="border-start"></span>
                  <div class="text-end ms-3 me-3 mt-2">
                    <li><a href="{% url 'home_page'%}" class="d-block link-offset-2 link-offset-3-hover link-secondary link-underline-light text-light">Beta Test</a></li>
                  </div>
                  <div class="text-end ms-3 me-3 mt-2">
                    <li><a href="{% url 'intro'%}" class="d-block link-offset-2 link-offset-3-hover link-secondary link-underline-light text-light">Getting Started</a></li>
                  </div>
            </header>
                <div class="col-4 d-flex justify-content-end align-items-center">
  {% if user.is_authenticated %}
    <div class="d-flex align-items-center me-1 position-relative">
      <!-- Dropdown -->
      <div class="dropdown me-3">
        <a href="#" 
           class="link-body-emphasis text-decoration-none dropdown-toggle text-light" 
           data-bs-toggle="dropdown" 
           aria-expanded="false">Profile
        </a>
        <ul class="dropdown-menu dropdown-menu-end text-small text-light mt-3" 
            style="width: auto; min-width: 150px; white-space: nowrap;">
          <li>
            <a class="dropdown-item fs-6" href="{% url 'create:character_list'%}">Characters</a>
          </li>
          <li>
            <form method="post" action="{% url 'logout' %}" class="dropdown-item mb-0">
              {% csrf_token %}
              <button type="submit" class="btn btn-primary btn-sm btn-dark w-100">
                Log Out
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>

  {% else %}
    <div class="text-end ms-3 me-3 mt-2">
      <a href="/accounts/login" 
         class="d-block link-offset-2 link-offset-3-hover link-secondary link-underline-dark text-dark">
         Login
      </a>
    </div>
  {% endif %}
</div>

        </nav>
      <body class="d-flex flex-column min-vh-100" style="background-color: #f0d7a8;">
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <script>
          const searchButton = document.getElementById('search-button');
          const searchInput = document.getElementById('search-input');
          searchButton.addEventListener('click', function() {

              searchInput.style.display = (searchInput.style.display === 'none' || searchInput.style.display === '') ? 'block' : 'none';
      
              if (searchInput.style.display === 'block') {
                  searchInput.focus();
              }
          });
      </script>
    </body>
    {%block content%}


    {%endblock%}

   <div class="container mt-5 border-top border-dark" style="background-color: #f0d7a8;">
        <footer class="mt-auto">
          <ul class="nav justify-content-center border-bottom border-dark pb-3 mb-3">
            <li class="nav-item"><a href="https://www.x.com/outerwestrpg" class="nav-link px-2 text-body-secondary text-decoration-underline">X</a></li>
            <li class="nav-item"><a href="https://www.instagram.com/outerwestrpg" class="nav-link px-2 text-body-secondary text-decoration-underline">Instagram</a></li>
            <li class="nav-item"><a href="https://bsky.app/profile/outerwestrpg.bsky.social" class="nav-link px-2 text-body-secondary text-decoration-underline">Bluesky</a></li>
            <li class="nav-item"><a href="https://www.patreon.com/outerwest" class="nav-link px-2 text-body-secondary text-decoration-underline">Patreon</a></li>
            <li class="nav-item"><a href="https://discord.gg/Zu54fUH6uK" class="nav-link px-2 text-body-secondary text-decoration-underline">Discord</a></li>
          </ul>
          <p class="nav-item"><a href="https://www.raspberryjamgames.com/" class="nav-link-underline px-2 text-body-secondary">©Raspberry Jam</a></p>
        </footer>
      </div>
</html>
